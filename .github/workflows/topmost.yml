# DLL da "tela de privacidade" do Windows (cópia adaptada de rustdesk/.github/workflows/third-party-RustDeskTempTopMostWindow.yml).
name: Tela de privacidade

on:
  workflow_call:

jobs:
  topmost:
    runs-on: windows-2022
    steps:
      - name: MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Código
        run: git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow

      - name: Compilar
        run: |
          cd RustDeskTempTopMostWindow && git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

      - name: Guardar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: topmost
          path: ./RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll
